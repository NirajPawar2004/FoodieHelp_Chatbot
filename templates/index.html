<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodieHelp — Customer Support</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #FF5722;
      --primary-dark: #E64A19;
      --primary-light: #FFCCBC;
      --bg: #F4F6F8;
      --card-bg: #FFFFFF;
      --text: #1F2937;
      --text-muted: #6B7280;
      --border: #E5E7EB;
      --user-bubble: #FF5722;
      --agent-bubble: #FFFFFF;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Navigation Header */
    header {
      background: #FFFFFF;
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow-sm);
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #FF6F00 0%, #FF3D00 100%);
      color: white;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 2px 8px rgba(255, 87, 34, 0.3);
    }

    .brand-info h1 {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #10B981;
      font-weight: 600;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #10B981;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.1); }
      100% { opacity: 1; transform: scale(1); }
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-outline {
      background: white;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-outline:hover {
      background: #F9FAFB;
      border-color: #D1D5DB;
    }

    /* Main Container */
    .chat-wrapper {
      flex: 1;
      display: flex;
      justify-content: center;
      overflow: hidden;
      padding: 16px 20px 24px;
    }

    .chat-box {
      width: 100%;
      max-width: 860px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-md);
      overflow: hidden;
    }

    /* Quick Help Topics Carousel */
    .topics-bar {
      padding: 12px 18px;
      background: #FAFAFA;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 8px;
      overflow-x: auto;
      white-space: nowrap;
    }

    .topic-chip {
      background: white;
      border: 1px solid var(--border);
      color: #374151;
      font-size: 12.5px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .topic-chip:hover {
      background: #FFF7ED;
      color: #C2410C;
      border-color: #FDBA74;
    }

    /* Messages History */
    .messages-container {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
      background: #F9FAFB;
    }

    .msg-group {
      display: flex;
      gap: 12px;
      max-width: 82%;
    }

    .msg-group.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .msg-group.assistant {
      align-self: flex-start;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      flex-shrink: 0;
      background: #E5E7EB;
    }

    .msg-group.user .avatar {
      background: var(--primary);
      color: white;
    }

    .msg-content {
      padding: 14px 18px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.55;
      word-break: break-word;
      box-shadow: var(--shadow-sm);
    }

    .msg-group.user .msg-content {
      background: var(--user-bubble);
      color: white;
      border-bottom-right-radius: 3px;
    }

    .msg-group.assistant .msg-content {
      background: var(--agent-bubble);
      color: var(--text);
      border-bottom-left-radius: 3px;
      border: 1px solid var(--border);
    }

    .badge-action {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      background: #EFF6FF;
      color: #1D4ED8;
      padding: 2px 10px;
      border-radius: 12px;
      margin-bottom: 8px;
      border: 1px solid #DBEAFE;
    }

    /* Confirmation Box */
    .confirmation-box {
      margin-top: 12px;
      background: #FFFBEB;
      border: 1px solid #FCD34D;
      border-radius: 10px;
      padding: 12px 14px;
    }

    .confirmation-actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .btn-confirm {
      background: #DC2626;
      color: white;
      border: none;
      padding: 7px 16px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 12.5px;
      cursor: pointer;
    }

    .btn-keep {
      background: white;
      color: #4B5563;
      border: 1px solid #D1D5DB;
      padding: 7px 16px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 12.5px;
      cursor: pointer;
    }

    /* Policy Reference Pill */
    .policy-pill {
      margin-top: 10px;
      font-size: 11.5px;
      color: #4B5563;
      background: #F3F4F6;
      padding: 4px 10px;
      border-radius: 6px;
      display: inline-block;
      border: 1px solid #E5E7EB;
    }

    /* Input Footer */
    .input-bar {
      padding: 14px 18px;
      background: #FFFFFF;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .input-field {
      flex: 1;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-field:focus {
      border-color: var(--primary);
    }

    .btn-send {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0 22px;
      height: 44px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-send:hover {
      background: var(--primary-dark);
    }
  </style>
</head>
<body>

  <!-- Top App Bar -->
  <header>
    <div class="brand">
      <div class="brand-logo">🍔</div>
      <div class="brand-info">
        <h1>FoodieHelp Support</h1>
        <div class="status-indicator">
          <span class="status-dot"></span>
          <span>Online • Typically replies instantly</span>
        </div>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn-outline" onclick="resetChat()">🔄 New Conversation</button>
    </div>
  </header>

  <!-- Main Chat Center -->
  <div class="chat-wrapper">
    <div class="chat-box">

      <!-- Quick Topics Navigation -->
      <div class="topics-bar">
        <button class="topic-chip" onclick="sendQuickPrompt('Where is my order?')">📍 Track My Order</button>
        <button class="topic-chip" onclick="sendQuickPrompt('Can I cancel my order while it is Preparing?')">⏱️ Order Cancellation Policy</button>
        <button class="topic-chip" onclick="sendQuickPrompt('An item was missing from my order. How do I get a refund?')">💰 Missing Item Refund</button>
        <button class="topic-chip" onclick="sendQuickPrompt('I received non-vegetarian food instead of vegetarian!')">⚠️ Wrong Food / Dietary Violation</button>
        <button class="topic-chip" onclick="sendQuickPrompt('What is your packaging and tamper seal policy?')">🛡️ Food Safety & Tamper Seal</button>
        <button class="topic-chip" onclick="sendQuickPrompt('Connect me to a human support executive')">🤝 Speak with Human Agent</button>
      </div>

      <!-- Messages Viewport -->
      <div id="messagesContainer" class="messages-container">
        <!-- Rendered via JavaScript -->
      </div>

      <!-- User Input Bar -->
      <div class="input-bar">
        <input 
          type="text" 
          id="chatInput" 
          class="input-field" 
          placeholder="Ask a question or enter your Order ID (e.g. 'Status of ORD1001')..."
          onkeydown="if(event.key === 'Enter') handleSend()"
        >
        <button class="btn-send" onclick="handleSend()">Send</button>
      </div>

    </div>
  </div>

  <script>
    let pendingConfirmation = null;
    let messages = [];

    window.addEventListener("DOMContentLoaded", () => {
      renderWelcome();
    });

    function renderWelcome() {
      messages = [{
        role: "assistant",
        action: "FoodieHelp Support",
        content: `👋 Hello! Welcome to **FoodieHelp Customer Support**.<br><br>
        I can help you track active food deliveries, explain refund policies, assist with cancellations, report missing or incorrect items, or connect you with human customer care.<br><br>
        How can we assist you today?`,
        sources: []
      }];
      renderMessages();
    }

    function renderMessages() {
      const container = document.getElementById("messagesContainer");
      container.innerHTML = "";

      messages.forEach(m => {
        const group = document.createElement("div");
        group.className = `msg-group ${m.role}`;

        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = m.role === "user" ? "👤" : "🍔";

        const bubble = document.createElement("div");
        bubble.className = "msg-content";

        let html = formatMarkdown(m.content);

        // Cancellation Confirmation Action
        if (m.pending_confirmation) {
          html += `
            <div class="confirmation-box">
              <strong style="color: #92400E; font-size: 13px;">⚠️ Confirmation Required:</strong>
              <div style="font-size: 12.5px; color: #78350F; margin-top: 4px;">Do you wish to proceed with cancelling this order under our cancellation policy?</div>
              <div class="confirmation-actions">
                <button class="btn-confirm" onclick="sendQuickPrompt('Confirm Cancel')">Yes, Cancel Order</button>
                <button class="btn-keep" onclick="sendQuickPrompt('No, keep order')">No, Keep Order</button>
              </div>
            </div>
          `;
        }

        bubble.innerHTML = html;
        group.appendChild(avatar);
        group.appendChild(bubble);
        container.appendChild(group);
      });

      container.scrollTop = container.scrollHeight;
    }

    async function handleSend() {
      const input = document.getElementById("chatInput");
      const text = input.value.trim();
      if (!text) return;

      input.value = "";
      messages.push({ role: "user", content: text });
      renderMessages();

      // Show typing indicator
      const typing = { role: "assistant", content: "<em>FoodieHelp is checking...</em>" };
      messages.push(typing);
      renderMessages();

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message: text,
            customer_id: "CUST001",
            pending_confirmation: pendingConfirmation
          })
        });

        const data = await res.json();
        messages.pop(); // remove typing indicator

        pendingConfirmation = data.pending_confirmation || null;

        messages.push({
          role: "assistant",
          action: data.action_taken,
          content: data.content,
          sources: data.sources || [],
          pending_confirmation: pendingConfirmation
        });

        renderMessages();
      } catch (err) {
        console.error("Chat request failed:", err);
        messages.pop();
        messages.push({
          role: "assistant",
          content: "We encountered a temporary connection issue. Please check that the server is running and try again."
        });
        renderMessages();
      }
    }

    function sendQuickPrompt(text) {
      document.getElementById("chatInput").value = text;
      handleSend();
    }

    function resetChat() {
      pendingConfirmation = null;
      renderWelcome();
    }

    function formatMarkdown(text) {
      if (!text) return "";
      return text
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>')
        .replace(/`(.*?)`/g, '<code>$1</code>')
        .replace(/\n\n/g, '<br><br>')
        .replace(/\n/g, '<br>');
    }
  </script>
</body>
</html>
