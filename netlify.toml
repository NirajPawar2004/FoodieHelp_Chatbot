[build]
  command = "pip install -r requirements.txt"
  publish = "templates"

[build.environment]
  PYTHON_VERSION = "3.11"
  PYTHONIOENCODING = "utf-8"

[functions]
  directory = "netlify/functions"
  included_files = [
    "data/**",
    "templates/**",
    "agent/**",
    "config/**",
    "database/**",
    "ingestion/**",
    "rag/**",
    "services/**",
    "app.py"
  ]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api"
  status = 200
