[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  PYTHON_VERSION = "3.11"
  PYTHONIOENCODING = "utf-8"

[functions]
  included_files = [
    "data/**",
    "templates/**",
    "agent/**",
    "config/**",
    "database/**",
    "ingestion/**",
    "rag/**",
    "services/**",
    "app.py"
  ]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
